<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>生日小测试 🎂</title>
  <style>
    body {
      background-color: #e0f7ff;
      font-family: 'Segoe UI', sans-serif;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h1 {
      color: #1e90ff;
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      color: #007acc;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 20px;
      border: 1px solid #b3e0ff;
      border-radius: 8px;
    }

    button {
      background-color: #1e90ff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1c86ee;
    }

    .result {
      text-align: center;
      color: #007acc;
    }

    .gift-link {
      color: #1e90ff;
      font-size: 18px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎂 亲爱的生日小测试 🎁</h1>
    <form id="quizForm">
      <div id="questions"></div>
      <button type="submit">提交并查看礼物 🎉</button>
    </form>
    <div id="result" class="result" style="display: none;">
      <h2>全对啦！你太厉害啦！🥳</h2>
      <p>答对了全部问题，礼物就是 👉</p>
      <a href="https://your-gift-link.com" class="gift-link" target="_blank">点我领取生日礼物 💝</a>
    </div>
  </div>

  <script>
    const questions = [
      { q: '我最喜欢的华语女歌手是？', answers: ['焦安溥'] },
      { q: '我最喜欢的诗人是？', answers: ['苏轼'] },
      { q: '我最喜欢的女团是？', answers: ['fx'] },
      { q: '我最近几年最喜欢的一首歌是？', answers: ['最好的时光'] },
      { q: '苏打绿哪一首歌是关于希特勒？', answers: ['无与伦比的美丽'] },
      { q: '我最喜欢的内地城市是？', answers: ['苏州'] },
      { q: '我最期待你做的事情是？', answers: ['学习'] },
      { q: '我最讨厌的学科是？', answers: ['政治', '物理'] },
      { q: '我今年一直想恢复但都失败了的事情是？', answers: ['健身', '运动'] },
      { q: '我认为最好的一年是？', answers: ['2018'] }
    ];

    const questionsContainer = document.getElementById('questions');

    questions.forEach((item, index) => {
      const label = document.createElement('label');
      label.textContent = `${index + 1}. ${item.q}`;
      const input = document.createElement('input');
      input.type = 'text';
      input.required = true;
      input.name = `q${index}`;
      input.dataset.answers = JSON.stringify(item.answers.map(a => a.toLowerCase()));
      questionsContainer.appendChild(label);
      questionsContainer.appendChild(input);
    });

    const form = document.getElementById('quizForm');
    const result = document.getElementById('result');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const inputs = form.querySelectorAll('input');
      let allCorrect = true;

      inputs.forEach((input) => {
        const userAnswer = input.value.trim().toLowerCase();
        const correctAnswers = JSON.parse(input.dataset.answers);
        if (!correctAnswers.includes(userAnswer)) {
          allCorrect = false;
        }
      });

      if (!allCorrect) {
        alert('有些答案不太对哦，再试试看～');
        return;
      }

      form.style.display = 'none';
      result.style.display = 'block';
    });
  </script>
</body>
</html>
