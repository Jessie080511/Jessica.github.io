<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>生日闯关小游戏 🎂</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #a0e0ff, #e0f7ff);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    h1 {
      color: #1e90ff;
      font-size: 28px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #007acc;
      font-size: 18px;
      margin-bottom: 10px;
    }

    input {
      padding: 10px;
      width: 100%;
      border-radius: 8px;
      border: 1px solid #b3e0ff;
      margin-bottom: 20px;
      font-size: 16px;
    }

    button {
      background-color: #1e90ff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #1c86ee;
    }

    .hidden {
      display: none;
    }

    .result {
      font-size: 20px;
      color: #1e90ff;
      margin-top: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="card" id="quiz">
    <h1>🎉 答对每题才能继续 🎉</h1>
    <div id="questionBox">
      <label id="questionText"></label>
      <input type="text" id="answerInput" placeholder="请输入答案..." />
      <button onclick="submitAnswer()">提交</button>
      <div class="result" id="feedback"></div>
    </div>
    <div id="giftBox" class="hidden">
      <h2>🎁 全部答对啦！</h2>
      <p>你的生日惊喜礼物链接 👉</p>
      <a href="https://your-gift-link.com" target="_blank" style="font-size:18px; color:#1e90ff; text-decoration:underline;">点我领取 💝</a>
    </div>
  </div>

  <script>
    const questions = [
      { q: '我最喜欢的华语女歌手是？', answers: ['焦安溥'] },
      { q: '我最喜欢的诗人是？', answers: ['苏轼'] },
      { q: '我最喜欢的女团是？', answers: ['fx'] },
      { q: '我最近几年最喜欢的一首歌是？', answers: ['最好的时光'] },
      { q: '我最喜欢苏打绿哪一首歌？', answers: ['他举起右手点名'] },
      { q: '我最喜欢的内地城市是？', answers: ['苏州'] },
      { q: '我最期待你做的事情是？', answers: ['学习'] },
      { q: '我最讨厌的学科是？', answers: ['政治', '物理'] },
      { q: '我今年一直想恢复但都失败了的事情是？', answers: ['健身', '运动'] },
      { q: '我认为最好的一年是？', answers: ['2018'] }
    ];

    let current = 0;

    const questionText = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const feedback = document.getElementById('feedback');
    const giftBox = document.getElementById('giftBox');
    const questionBox = document.getElementById('questionBox');

    function showQuestion(index) {
      questionText.textContent = `${index + 1}. ${questions[index].q}`;
      answerInput.value = '';
      feedback.textContent = '';
    }

    function submitAnswer() {
      const input = answerInput.value.trim().toLowerCase();
      const validAnswers = questions[current].answers.map(a => a.toLowerCase());
      if (validAnswers.includes(input)) {
        current++;
        if (current < questions.length) {
          showQuestion(current);
        } else {
          questionBox.classList.add('hidden');
          giftBox.classList.remove('hidden');
        }
      } else {
        feedback.textContent = '答案不对哦～再想想！';
      }
    }

    showQuestion(current);
  </script>
</body>
</html>
