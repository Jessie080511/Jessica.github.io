# 由于执行状态重置，我们需要重新生成文件
html_code = """
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>星空下的了解度测试 💙</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    canvas#stars {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(30,144,255,0.2);
      backdrop-filter: blur(10px);
    }

    h1, h2 {
      text-align: center;
      color: #66ccff;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    input::placeholder {
      color: #aaa;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      background: #3399ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px #00f2ff;
    }

    .result {
      margin-top: 20px;
      text-align: center;
      font-size: 18px;
      color: #33ccff;
    }

    #letterBox {
      white-space: pre-wrap;
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 20px;
      font-size: 18px;
      line-height: 1.6;
      color: #d4eaff;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <audio autoplay loop src="https://jessie080511.github.io/Jessica.github.io/pyrojewel.mp3"></audio>
  <div class="container">
    <h1>🌌 星空下的了解度测试 🌌</h1>
    <div id="questionBox">
      <label id="questionText"></label>
      <input type="text" id="answerInput" placeholder="请输入答案..." />
      <button onclick="submitAnswer()">下一题</button>
      <div class="result" id="feedback"></div>
    </div>
    <div id="giftBox" style="display:none;">
      <h2 id="scoreResult"></h2>
      <button id="showLetterBtn" onclick="showLetter()">💌 打开信件</button>
      <div id="letterBox"></div>
    </div>
  </div>

  <script>
    const questions = [
      { q: '我最喜欢的华语女歌手是？', answers: ['焦安溥', '安溥', '张悬'] },
      { q: '我最喜欢的诗人是？', answers: ['苏轼'] },
      { q: '我最喜欢的女团是？', answers: ['fx'] },
      { q: '我最近几年最喜欢的一首歌是？', answers: ['最好的时光'] },
      { q: '我最喜欢苏打绿哪一首歌？', answers: ['他举起右手点名'] },
      { q: '我最喜欢的内地城市是？', answers: ['苏州'] },
      { q: '我最期待你做的事情是？', answers: ['学习'] },
      { q: '我最讨厌的学科是？', answers: ['政治', '物理'] },
      { q: '我今年一直想恢复但都失败了的事情是？', answers: ['健身', '运动'] },
      { q: '我认为最好的一年是？', answers: ['2018'] }
    ];

    let current = 0;
    let correctCount = 0;

    const questionText = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const feedback = document.getElementById('feedback');
    const questionBox = document.getElementById('questionBox');
    const giftBox = document.getElementById('giftBox');
    const letterBox = document.getElementById('letterBox');
    const showLetterBtn = document.getElementById('showLetterBtn');
    const scoreResult = document.getElementById('scoreResult');

    function showQuestion(index) {
      questionText.textContent = `${index + 1}. ${questions[index].q}`;
      answerInput.value = '';
      feedback.textContent = '';
    }

    function submitAnswer() {
      const input = answerInput.value.trim().toLowerCase();
      const validAnswers = questions[current].answers.map(a => a.toLowerCase());
      if (validAnswers.includes(input)) {
        correctCount++;
        feedback.textContent = '✅ 回答正确！';
      } else {
        feedback.textContent = '❌ 不太对～不过我们继续！';
      }
      current++;
      setTimeout(() => {
        if (current < questions.length) {
          showQuestion(current);
        } else {
          showScore();
        }
      }, 800);
    }

    function showScore() {
      questionBox.style.display = 'none';
      giftBox.style.display = 'block';
      const score = Math.round((correctCount / questions.length) * 100);
      scoreResult.textContent = `你的了解度：${score}%`;
      if (score >= 90) {
        showLetterBtn.style.display = 'inline-block';
      } else {
        scoreResult.textContent += '\\n再努力一下就可以解锁信啦～💔';
      }
    }

    function showLetter() {
      const msg = `亲爱的宝贝：\\n\\n你真的好懂我呀，看到你的分数我真的很感动～\\n这封信送给你，也送给我们共同度过的所有回忆和未来的期待。\\n❤️\\n\\n我爱你，永远永远～\\n💌`;
      letterBox.style.display = 'block';
      letterBox.textContent = '';
      let i = 0;
      function type() {
        if (i < msg.length) {
          letterBox.textContent += msg.charAt(i);
          i++;
          setTimeout(type, 40);
        }
      }
      type();
      explodeFirework();
    }

    function explodeFirework() {
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.style.position = 'fixed';
        p.style.width = '6px';
        p.style.height = '6px';
        p.style.borderRadius = '50%';
        p.style.background = `hsl(${Math.random() * 360}, 100%, 70%)`;
        p.style.left = window.innerWidth/2 + 'px';
        p.style.top = window.innerHeight/2 + 'px';
        p.style.zIndex = 999;
        document.body.appendChild(p);
        const angle = Math.random() * 2 * Math.PI;
        const radius = Math.random() * 150;
        const dx = Math.cos(angle) * radius;
        const dy = Math.sin(angle) * radius;
        p.animate([
          { transform: `translate(0, 0)`, opacity: 1 },
          { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 }
        ], {
          duration: 1000 + Math.random() * 500,
          easing: 'ease-out'
        });
        setTimeout(() => p.remove(), 1200);
      }
    }

    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createStars() {
      stars = [];
      for (let i = 0; i < 200; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.5,
          d: Math.random() * 0.5 + 0.1
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#66ccff';
      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
        star.y -= star.d;
        if (star.y < 0) {
          star.y = canvas.height;
          star.x = Math.random() * canvas.width;
        }
      });
    }

    function animateStars() {
      drawStars();
      requestAnimationFrame(animateStars);
    }

    resize();
    createStars();
    animateStars();
    window.addEventListener('resize', () => {
      resize();
      createStars();
    });

    showQuestion(current);
  </script>
</body>
</html>
"""
