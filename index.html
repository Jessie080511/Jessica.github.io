<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>了解度星空测试 🌌</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(ellipse at center, #0b1c3d 0%, #000000 100%);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      color: #fff;
      overflow: hidden;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px;
      position: relative;
      z-index: 2;
      backdrop-filter: blur(10px);
      background: rgba(20, 30, 60, 0.4);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
    }
    h1, h2 {
      color: #7ec9ff;
      text-align: center;
    }
    .question-box, .gift-box {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 0 15px rgba(255,255,255,0.05);
    }
    label {
      font-weight: bold;
      color: #a8d3ff;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    button {
      background-color: #3c9dff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      position: relative;
      overflow: hidden;
    }
    button:hover {
      background-color: #197edb;
    }
    .result {
      color: #7ec9ff;
      text-align: center;
      font-size: 20px;
      margin-top: 10px;
    }
    .letter {
      white-space: pre-wrap;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
      font-size: 18px;
      line-height: 1.7;
      color: #dbeaff;
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <canvas id="fireworks"></canvas>
  <audio id="bgm" loop autoplay src="https://jessie080511.github.io/Jessica.github.io/pyrojewel.mp3"></audio>
  <div class="container">
    <h1>🌌 星空下的了解度测试 🌌</h1>
    <div class="question-box" id="questionBox">
      <label id="questionText"></label>
      <input type="text" id="answerInput" placeholder="请输入答案..." />
      <button onclick="submitAnswer(event)">下一题</button>
      <div class="result" id="feedback"></div>
    </div>
    <div class="gift-box hidden" id="giftBox">
      <h2 id="scoreResult"></h2>
      <button class="hidden" id="showLetterBtn" onclick="showLetter(event)">💌 打开信件</button>
      <div id="letterBox" class="letter hidden"></div>
    </div>
  </div>
  <script>
    const questions = [...]; // 省略问题列表，为节省空间
    let current = 0;
    let correctCount = 0;
    const questionText = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const feedback = document.getElementById('feedback');
    const questionBox = document.getElementById('questionBox');
    const giftBox = document.getElementById('giftBox');
    const letterBox = document.getElementById('letterBox');
    const showLetterBtn = document.getElementById('showLetterBtn');
    const scoreResult = document.getElementById('scoreResult');
    function showQuestion(index) {
      questionText.textContent = `${index + 1}. ${questions[index].q}`;
      answerInput.value = '';
      feedback.textContent = '';
    }
    function submitAnswer(e) {
      triggerBurst(e);
      const input = answerInput.value.trim().toLowerCase();
      const validAnswers = questions[current].answers.map(a => a.toLowerCase());
      if (validAnswers.includes(input)) {
        correctCount++;
        feedback.textContent = '✅ 回答正确！';
      } else {
        feedback.textContent = '❌ 这个答案不太对～我们继续！';
      }
      current++;
      setTimeout(() => {
        if (current < questions.length) {
          showQuestion(current);
        } else {
          showScore();
        }
      }, 1000);
    }
    function showScore() {
      questionBox.classList.add('hidden');
      giftBox.classList.remove('hidden');
      const score = Math.round((correctCount / questions.length) * 100);
      scoreResult.textContent = `你的了解度：${score}%`;
      if (score >= 90) {
        showLetterBtn.classList.remove('hidden');
      } else {
        scoreResult.textContent += '\n还差一点点就能看到信啦，再试一次吧~ 💔';
      }
    }
    function showLetter(e) {
      triggerBurst(e);
      const message = `亲爱的宝贝：\n\n你真的好懂我呀，看到你的分数我真的很感动～\n这封信送给你，也送给我们共同度过的所有回忆和未来的期待。\n❤️\n\n我爱你，永远永远～\n💌`;
      letterBox.classList.remove('hidden');
      letterBox.textContent = '';
      let i = 0;
      function typeWriter() {
        if (i < message.length) {
          letterBox.textContent += message.charAt(i);
          i++;
          setTimeout(typeWriter, 40);
        }
      }
      typeWriter();
    }
    showQuestion(current);
    // 星空背景
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    const stars = Array.from({ length: 150 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.5 + 0.5,
      d: Math.random() * 0.5 + 0.2
    }));
    function drawStars() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#fff';
      stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        s.y -= s.d;
        if (s.y < 0) s.y = h;
      });
      requestAnimationFrame(drawStars);
    }
    drawStars();
    // 🎆 烟花爆炸动画
    const fCanvas = document.getElementById('fireworks');
    const fCtx = fCanvas.getContext('2d');
    function resizeFireworks() {
      fCanvas.width = window.innerWidth;
      fCanvas.height = window.innerHeight;
    }
    resizeFireworks();
    window.addEventListener('resize', resizeFireworks);
    function triggerBurst(e) {
      const rect = fCanvas.getBoundingClientRect();
      const x = (e.clientX || rect.width / 2);
      const y = (e.clientY || rect.height / 2);
      for (let i = 0; i < 30; i++) {
        particles.push({
          x: x,
          y: y,
          r: Math.random() * 2 + 2,
          dx: Math.cos(i * 12) * (Math.random() * 3 + 1),
          dy: Math.sin(i * 12) * (Math.random() * 3 + 1),
          life: 100,
          color: `hsl(${Math.random() * 360}, 100%, 70%)`
        });
      }
    }
    let particles = [];
    function animateFireworks() {
      fCtx.clearRect(0, 0, fCanvas.width, fCanvas.height);
      particles.forEach((p, i) => {
        p.x += p.dx;
        p.y += p.dy;
        p.life -= 1;
        fCtx.beginPath();
        fCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        fCtx.fillStyle = p.color;
        fCtx.fill();
        if (p.life <= 0) particles.splice(i, 1);
      });
      requestAnimationFrame(animateFireworks);
    }
    animateFireworks();
  </script>
</body>
</html>
