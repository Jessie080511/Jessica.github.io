<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎂 星空下的生日了解测试 🎉</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
      color: #e0f7ff;
    }

    canvas#stars, canvas#meteors {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 800px;
      margin: 60px auto;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 25px;
      box-shadow: 0 0 30px rgba(30,144,255,0.25);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    h1 {
      font-size: 30px;
      color: #b3e5ff;
    }

    h2 {
      font-size: 24px;
      color: #ffffff;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 16px 0;
      border-radius: 50px;
      border: none;
      font-size: 16px;
      background: rgba(255,255,255,0.15);
      color: #e0f7ff;
      text-align: center;
    }

    input::placeholder {
      color: #aaa;
    }

    button {
      padding: 14px 28px;
      font-size: 16px;
      background: #1e88e5;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s ease;
    }

    button:hover {
      background: #42a5f5;
      transform: scale(1.05);
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
      color: #90caf9;
    }

    #letterBox {
      white-space: pre-wrap;
      margin-top: 25px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 25px;
      padding: 24px;
      font-size: 18px;
      line-height: 1.7;
      color: #e0f7ff;
      display: none;
      text-align: left;
    }

    .score-title {
      margin-top: 30px;
      font-size: 20px;
      color: #81d4fa;
    }

    #giftNote {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 18px;
      background: rgba(255,255,255,0.07);
      color: #e0f7ff;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <canvas id="meteors"></canvas>
  <audio autoplay loop src="https://jessie080511.github.io/Jessica.github.io/pyrojewel.mp3"></audio>
  <div class="container">
    <h1>🌌 生日快乐🎂 瘦莎莎 🌌</h1>
    <h2>✨请先完成了解度测试，90%以上才可以解锁礼物哦～✨</h2>

    <div id="questionBox">
      <label id="questionText"></label>
      <input type="text" id="answerInput" placeholder="请输入答案..." />
      <button onclick="submitAnswer(event)">下一题</button>
      <div class="result" id="feedback"></div>
    </div>

    <div id="giftBox" style="display:none;">
      <div class="score-title" id="scoreResult"></div>
      <button id="showLetterBtn" onclick="showLetter()">💌 打开生日信</button>
      <div id="letterBox"></div>
      <button id="revealGiftBtn" style="display:none;" onclick="showGiftNote()">🎁 查看礼物在哪里</button>
      <div id="giftNote">礼物在装衣服的框框里哦～👗🎁</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    const meteorCanvas = document.getElementById('meteors');
    const mctx = meteorCanvas.getContext('2d');

    let stars = [], meteors = [];

    function resize() {
      canvas.width = meteorCanvas.width = window.innerWidth;
      canvas.height = meteorCanvas.height = window.innerHeight;
    }

    function createStars() {
      stars = [];
      for (let i = 0; i < 800; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.3 + 0.5,
          d: Math.random() * 0.3 + 0.05
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#66ccff';
      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
        star.y -= star.d;
        if (star.y < 0) {
          star.y = canvas.height;
          star.x = Math.random() * canvas.width;
        }
      });
    }

    function drawMeteors() {
      mctx.clearRect(0, 0, meteorCanvas.width, meteorCanvas.height);
      meteors.forEach(meteor => {
        mctx.beginPath();
        mctx.strokeStyle = 'rgba(255,255,255,0.8)';
        mctx.moveTo(meteor.x, meteor.y);
        mctx.lineTo(meteor.x + meteor.len * -0.5, meteor.y + meteor.len);
        mctx.stroke();
        meteor.x -= meteor.speedX;
        meteor.y += meteor.speedY;
      });
      meteors = meteors.filter(m => m.y < window.innerHeight && m.x > 0);
      if (Math.random() < 0.02) {
        meteors.push({
          x: Math.random() * window.innerWidth,
          y: 0,
          len: Math.random() * 80 + 50,
          speedX: Math.random() * 2 + 1,
          speedY: Math.random() * 2 + 1
        });
      }
    }

    function animate() {
      drawStars();
      drawMeteors();
      requestAnimationFrame(animate);
    }

    resize();
    createStars();
    animate();
    window.addEventListener('resize', () => {
      resize();
      createStars();
    });

    const questions = [
      { q: '我最喜欢的华语女歌手是？', answers: ['焦安溥', '安溥', '张悬'] },
      { q: '我最喜欢的诗人是？', answers: ['苏轼'] },
      { q: '我最喜欢的女团是？', answers: ['fx'] },
      { q: '我最近几年最喜欢的一首歌是？', answers: ['最好的时光'] },
      { q: '我最喜欢苏打绿哪一首歌？', answers: ['他举起右手点名'] },
      { q: '我最喜欢的内地城市是？', answers: ['苏州'] },
      { q: '我最期待你做的事情是？', answers: ['学习'] },
      { q: '我最讨厌的学科是？', answers: ['政治', '物理'] },
      { q: '我今年一直想恢复但都失败了的事情是？', answers: ['健身', '运动'] },
      { q: '我认为最好的一年是？', answers: ['2018'] }
    ];

    let current = 0;
    let correctCount = 0;

    const questionText = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const feedback = document.getElementById('feedback');
    const questionBox = document.getElementById('questionBox');
    const giftBox = document.getElementById('giftBox');
    const letterBox = document.getElementById('letterBox');
    const showLetterBtn = document.getElementById('showLetterBtn');
    const scoreResult = document.getElementById('scoreResult');
    const giftNote = document.getElementById('giftNote');
    const revealGiftBtn = document.getElementById('revealGiftBtn');

    function showQuestion(index) {
      questionText.textContent = `${index + 1}. ${questions[index].q}`;
      answerInput.value = '';
      feedback.textContent = '';
    }

    function submitAnswer(e) {
      const input = answerInput.value.trim().toLowerCase();
      const validAnswers = questions[current].answers.map(a => a.toLowerCase());
      if (validAnswers.includes(input)) {
        correctCount++;
        feedback.textContent = '✅ 回答正确！';
      } else {
        feedback.textContent = '❌ 不太对～不过我们继续！';
      }
      current++;
      setTimeout(() => {
        if (current < questions.length) {
          showQuestion(current);
        } else {
          showScore();
        }
      }, 800);
    }

    function showScore() {
      questionBox.style.display = 'none';
      giftBox.style.display = 'block';
      const score = Math.round((correctCount / questions.length) * 100);
      scoreResult.textContent = `你的了解度：${score}%`;
      if (score >= 90) {
        showLetterBtn.style.display = 'inline-block';
      } else {
        showLetterBtn.style.display = 'none';
        scoreResult.textContent += '\\n再接再厉就能看到生日信啦～💔';
      }
    }

    function showLetter() {
      const msg = `瘦瘦的莎莎：\\n\\n啦啦啦，好玩吗，我猜你能答3道不能再多了 因为你是一个耳聋眼瞎加记性极差的人 让我来给你深刻的解释一下为什么是这十个答案。 1.我从高中开始就喜欢张悬，不管她是什么立场，但她给了我思想和力量，很多时候我听她的歌不是在听调子，我是觉得像是人生的旁白，有警醒和隽永。2.我说过很多次我喜欢苏轼，因为他有我羡慕但做不到的出世和洒脱，我最喜欢定风波，那是我最向往的人生状态。3.从初中开始我就觉得郑秀晶是最好看的女明星，amber是最有态度的中性女艺人。4.近几年只要有一点生活的感悟我都会想听到这首歌，我们总是在期待最好的时光，总是以为它还没来到，但其实过去的某一年，某一天就是最好的，会期待，证明还没有超过它。5.这是我认为苏打绿最好的一张专辑里最好的一首，这首歌的核心思想适用于任何一个时代中的任何一个边缘群体，6.没有久居过但很向往，喜欢它的城市底蕴。 7.我每天都在和你商量的问题，我觉得根源是你不喜欢学习，那我就很矛盾，好像我不能勉强你做不喜欢的事情，但是你是任何都不学，包括但不限于技能型、兴趣型、娱乐型，everything，我希望你可以汲取一些内容并且自己能感觉到进步和思想的丰富，最好是可以多互相分享，我也不是不让你看那些老太婆，但希望不只是看老太婆。8.其实最最最讨厌还是很政治，没有别的原因，就是单纯的学不好考不好。 9.我每天都在说要锻炼身体，感觉来美国后身体素质直线下滑，你也不会提醒我。10.目前没有哪一年的满足程度超过2018年，那是我灵魂最自由且充盈的一年，最合适的年纪，做了很多最喜欢的事，好像很简单，但现在看来很奢侈了，但也不失落，毕竟世间万物都不是静止的\\n❤️\\n\\n虽然你还是一副不了解我的样子，但还是把礼物给你吧，这样你15号才能给我拍美美的照片，恭喜你喜提发展一个技能的机会，生日快乐～💌`;
      letterBox.style.display = 'block';
      letterBox.textContent = '';
      let i = 0;
      function type() {
        if (i < msg.length) {
          letterBox.textContent += msg.charAt(i);
          i++;
          setTimeout(type, 40);
        } else {
          revealGiftBtn.style.display = 'inline-block';
        }
      }
      type();
    }

    function showGiftNote() {
      giftNote.style.display = 'block';
    }

    showQuestion(current);
  </script>
</body>
</html>
